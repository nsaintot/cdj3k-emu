# Structural limits CI enforces with `sentrux check .`. Raise min_quality and
# lower the size limits as the code improves; do not loosen them.
# max_file_lines admits guest/modules/virtio_snd/virtio_snd.c, a single-file
# kernel module.
# CI measures on Linux x86_64, where sentrux finds more call edges than on
# macOS and the quality reads about 0.003 lower. Record baseline.json there.
[constraints]
max_cycles = 0
no_god_files = true
min_quality = 0.70
max_cc = 20
max_fn_lines = 80
max_file_lines = 1400
