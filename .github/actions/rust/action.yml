name: Rust
description: >
  Install the toolchain rust-toolchain.toml pins, with the components and
  targets asked for, and cache cargo's output.
inputs:
  components:
    description: comma-separated rustup components
    default: ""
  targets:
    description: comma-separated rustup targets
    default: ""
runs:
  using: composite
  steps:
    - name: Toolchain
      shell: bash
      env:
        COMPONENTS: ${{ inputs.components }}
        TARGETS: ${{ inputs.targets }}
      run: |
        channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        args=(--profile minimal)
        if [[ -n "$COMPONENTS" ]]; then args+=(--component "$COMPONENTS"); fi
        if [[ -n "$TARGETS" ]]; then args+=(--target "$TARGETS"); fi
        rustup toolchain install "$channel" "${args[@]}"
        rustc --version
    - uses: Swatinem/rust-cache@v2
