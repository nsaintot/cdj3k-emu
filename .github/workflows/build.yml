# The builds that ci.yml and cd.yml share: the guest payload, QEMU for each
# host, the Windows cross-build of QEMU and the app, and the staged Linux tree.
# The guest payload and the QEMU builds are kept in the Actions cache, so pull
# requests reuse what the runs on main built. Every job uploads its output as an
# artifact of the calling run.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: The version the apps carry; Cargo.toml's when empty
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # This job builds the kernel, the out-of-tree modules, the shim and the guest
  # tools with the Docker stage of build.sh, natively on arm64. No Pioneer
  # firmware is involved. The cache key covers every input of the finished
  # payload. On a miss, the Docker layer cache rebuilds only the stages whose
  # inputs changed, so the kernel recompiles only for a new LINUX_TAG, patch
  # or config.
  guest:
    name: Guest payload
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: guest-payload.tar
          key: guest-${{ hashFiles('build.sh', 'docker/Dockerfile', '.dockerignore', 'guest/**', 'dropbear/build.sh') }}
      # Give buildx the runtime token that the gha cache backend needs.
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CDJ3K_DOCKER_CACHE: gha
        run: |
          ./build.sh --artifacts-only
          tar -cf guest-payload.tar build/Image build/docker-out guest/out
      - uses: actions/upload-artifact@v7
        with:
          name: guest-payload
          path: guest-payload.tar
          retention-days: 7

  qemu-linux:
    name: QEMU (Linux ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Cache
        id: cache
        uses: actions/cache@v6
        with:
          path: qemu-linux
          key: qemu-linux-${{ matrix.arch }}-${{ hashFiles('qemu/build.sh', 'qemu/patches/**', 'qemu/shim/**', 'docker/Dockerfile.linux-host*') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker buildx build -f docker/Dockerfile.linux-host --target qemu-artifacts \
              --output type=local,dest=qemu-linux/bin .
      - run: tar -cf qemu-linux.tar qemu-linux
      - uses: actions/upload-artifact@v7
        with:
          name: qemu-linux-${{ matrix.arch }}
          path: qemu-linux.tar
          retention-days: 7

  # This job cross-builds QEMU and the app for Windows with llvm-mingw in
  # docker/Dockerfile.windows-qemu.
  windows-cross:
    name: Cross-build (Windows ${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - { arch: x64, qemu: x86_64 }
          - { arch: arm64, qemu: aarch64 }
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Toolchain image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.windows-qemu
          tags: cdj3k-emu-windows-qemu
          load: true
          cache-from: type=gha,scope=windows-qemu
          cache-to: type=gha,scope=windows-qemu,mode=max
      - name: Cache QEMU
        id: cache
        uses: actions/cache@v6
        with:
          path: qemu/install-windows-${{ matrix.qemu }}
          key: qemu-windows-${{ matrix.qemu }}-${{ hashFiles('qemu/build.sh', 'qemu/patches/**', 'docker/Dockerfile.windows-qemu', 'docker/windows-qemu-deps.sh', 'scripts/bundle-dlls.sh') }}
      # qemu/build.sh uses the image that is already loaded.
      - name: QEMU
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./qemu/build.sh --windows ${{ matrix.qemu }}
      # Run only the inner half of cross-build.sh, in the image loaded above;
      # its outer half would rebuild the image with the local builder.
      # An empty CDJ3K_VERSION would become the app's version, so it is passed
      # only when the caller gives one.
      - name: App
        env:
          CDJ3K_VERSION: ${{ inputs.version }}
        run: |
          ./winit/fetch.sh
          version=()
          if [[ -n "$CDJ3K_VERSION" ]]; then version=(-e CDJ3K_VERSION); fi
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
              -e CDJ3K_WINDOWS_CROSS_INNER=1 "${version[@]}" -v "$PWD:/work" \
              cdj3k-emu-windows-qemu bash packaging/windows/cross-build.sh ${{ matrix.arch }}
      - run: tar -cf windows-cross.tar qemu/install-windows-${{ matrix.qemu }} dist/windows-bin-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-cross-${{ matrix.arch }}
          path: windows-cross.tar
          retention-days: 7

  # Build one QEMU per slice of the universal .app, each linked against static
  # libraries.
  qemu-macos:
    name: QEMU (macOS ${{ matrix.arch }})
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/qemu-macos
        with:
          arch: ${{ matrix.arch }}
      - run: tar -cf qemu-macos.tar qemu/install-macos-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: qemu-macos-${{ matrix.arch }}
          path: qemu-macos.tar
          retention-days: 7

  # The tree that every Linux package ships (packaging/linux/stage.sh), for
  # the E2E scenarios. The packages themselves are built in cd.yml.
  stage-linux:
    name: Stage (Linux ${{ matrix.arch }})
    needs: [guest, qemu-linux]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: guest-payload
      - uses: actions/download-artifact@v8
        with:
          name: qemu-linux-${{ matrix.arch }}
      - run: |
          tar -xf guest-payload.tar && tar -xf qemu-linux.tar
          rm guest-payload.tar qemu-linux.tar
      - uses: docker/setup-buildx-action@v4
      - name: Packaging image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.linux-pkg
          tags: cdj3k-emu-linux-pkg
          load: true
          cache-from: type=gha,scope=linux-pkg-${{ matrix.arch }}
          cache-to: type=gha,scope=linux-pkg-${{ matrix.arch }},mode=max
      - name: Stage
        env:
          CDJ3K_VERSION: ${{ inputs.version }}
        run: |
          version=()
          if [[ -n "$CDJ3K_VERSION" ]]; then version=(-e CDJ3K_VERSION); fi
          docker run --rm "${version[@]}" -v "$PWD:/work" cdj3k-emu-linux-pkg \
              "packaging/linux/stage.sh --qemu /work/qemu-linux"
          sudo chown -R "$(id -u):$(id -g)" dist
          tar -cf linux-tree.tar -C dist/linux opt
      - uses: actions/upload-artifact@v7
        with:
          name: linux-tree-${{ matrix.arch }}
          path: linux-tree.tar
          retention-days: 7
