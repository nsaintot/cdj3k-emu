# Package and release every platform's build. ci.yml builds and tests; this
# workflow turns the same builds (build.yml) into the dmg, the deb, the rpm, the
# AppImage and the Windows installers, and smoke-tests them.
#
#   push of a v<version> tag         a release: the tag must be on main and is the
#                                    version every artefact carries; an annotated
#                                    tag's message holds the release notes. macOS
#                                    is notarized and every artefact lands in a
#                                    draft GitHub release, published by hand. A
#                                    version with a hyphen (0.3.0-rc1) is a
#                                    pre-release.
#   pull request into main           the packages, when it touches the packaging
#   workflow_dispatch                the packages; `notarize` notarizes the macOS
#                                    build
#
# Other builds carry Cargo.toml's version, which nothing bumps.
#
# macOS is signed with the Developer ID in the release environment's secrets
# (see .github/scripts/macos-signing.sh); a pull request, which does not get
# that environment, is signed ad hoc. A release refuses to run without them.
name: CD

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/**
      - .github/workflows/build.yml
      - .github/workflows/cd.yml
      - docker/Dockerfile.linux-pkg
      - packaging/**
      - scripts/**
  workflow_dispatch:
    inputs:
      notarize:
        description: Notarize the macOS build
        type: boolean
        default: false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan
    # The signing and notary secrets live in the release environment, which a
    # pull request does not get: its macOS build is signed ad hoc.
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      bundle-version: ${{ steps.plan.outputs.bundle-version }}
      notarize: ${{ steps.plan.outputs.notarize }}
      release: ${{ steps.plan.outputs.release }}
      sign: ${{ steps.plan.outputs.sign }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        env:
          IN_NOTARIZE: ${{ inputs.notarize }}
          HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
          HAVE_NOTARY: ${{ secrets.NOTARY_API_KEY_BASE64 != '' }}
          HAVE_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          release=false
          notarize=false
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              version="${GITHUB_REF_NAME#v}"
              if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
                  echo "::error::tag $GITHUB_REF_NAME is not v<major>.<minor>.<patch>[-<pre>]"
                  exit 1
              fi
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                  echo "::error::tag $GITHUB_REF_NAME is not on main; release tags go on main only"
                  exit 1
              fi
              if [[ "$HAVE_CERT" != true || "$HAVE_NOTARY" != true ]]; then
                  echo "::error::a release needs the macOS signing and notary secrets"
                  exit 1
              fi
              if [[ "$HAVE_UPDATE_KEY" != true ]]; then
                  echo "::error::a release needs UPDATE_SIGNING_KEY to sign the update feeds"
                  exit 1
              fi
              release=true
              notarize=true
          elif [[ "$IN_NOTARIZE" == true ]]; then
              if [[ "$HAVE_CERT" != true || "$HAVE_NOTARY" != true ]]; then
                  echo "::error::notarizing needs the macOS signing and notary secrets"
                  exit 1
              fi
              notarize=true
          fi
          if [[ "$HAVE_CERT" != true ]]; then
              echo "::warning::The secrets hold no signing certificate; the macOS build is signed ad hoc."
          fi
          {
              echo "version=$version"
              # CFBundleShortVersionString takes the numeric part only.
              echo "bundle-version=${version%%-*}"
              echo "notarize=$notarize"
              echo "release=$release"
              echo "sign=$HAVE_CERT"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, sign $HAVE_CERT, notarize $notarize, release $release" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}

  package-macos:
    name: Package (macOS universal)
    needs: [plan, build]
    environment: ${{ github.event_name != 'pull_request' && 'release' || '' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: guest-payload
      - uses: actions/download-artifact@v8
        with:
          pattern: qemu-macos-*
      - run: |
          tar -xf guest-payload.tar && rm guest-payload.tar
          for t in qemu-macos-*/qemu-macos.tar; do tar -xf "$t"; done
          rm -rf qemu-macos-*
      - uses: ./.github/actions/rust
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Signing identity
        if: needs.plan.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISION_PROFILE_BASE64: ${{ secrets.MACOS_PROVISION_PROFILE_BASE64 }}
          NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
        run: .github/scripts/macos-signing.sh setup
      - name: Stage
        env:
          CDJ3K_VERSION: ${{ needs.plan.outputs.version }}
          BUNDLE_VERSION: ${{ needs.plan.outputs.bundle-version }}
        run: |
          ./winit/fetch.sh
          packaging/macos/stage.sh --arch universal --version "$BUNDLE_VERSION" --build "$GITHUB_RUN_NUMBER"
      - name: Sign and package
        env:
          CDJ3K_VERSION: ${{ needs.plan.outputs.version }}
          NOTARIZE: ${{ needs.plan.outputs.notarize }}
        run: |
          args=(--dmg)
          if [[ -n "${CODESIGN_IDENTITY:-}" ]]; then args+=(--sign "$CODESIGN_IDENTITY"); fi
          if [[ "$NOTARIZE" == true ]]; then args+=(--notarize); fi
          packaging/macos/build.sh "${args[@]}" --version "$CDJ3K_VERSION"
      - name: Check
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          NOTARIZE: ${{ needs.plan.outputs.notarize }}
        run: |
          app="dist/CDJ3K Emulator.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          # Check that every binary has both slices and links nothing from
          # outside the bundle and the OS.
          bad=0
          for f in "$app"/Contents/MacOS/*; do
              archs=$(lipo -archs "$f")
              echo "$(basename "$f"): $archs"
              [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "::error::$f is not universal"; bad=1; }
              if otool -L "$f" | tail -n +2 | grep -E '/(opt/homebrew|usr/local)/'; then bad=1; fi
          done
          [[ $bad -eq 0 ]] || exit 1
          "$app/Contents/MacOS/qemu-img" --version
          if [[ "$NOTARIZE" == true ]]; then
              xcrun stapler validate "$app"
              xcrun stapler validate "dist/CDJ3K-Emulator-$VERSION-macos-universal.dmg"
          fi
      - name: Remove signing identity
        if: always() && needs.plan.outputs.sign == 'true'
        run: .github/scripts/macos-signing.sh cleanup
      - uses: actions/upload-artifact@v7
        with:
          name: package-macos-universal
          path: dist/*.dmg
          compression-level: 0

  package-linux:
    name: Package (Linux ${{ matrix.arch }})
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: guest-payload
      - uses: actions/download-artifact@v8
        with:
          name: qemu-linux-${{ matrix.arch }}
      - run: |
          tar -xf guest-payload.tar && tar -xf qemu-linux.tar
          rm guest-payload.tar qemu-linux.tar
      - uses: docker/setup-buildx-action@v4
      - name: Packaging image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.linux-pkg
          tags: cdj3k-emu-linux-pkg
          load: true
          cache-from: type=gha,scope=linux-pkg-${{ matrix.arch }}
          cache-to: type=gha,scope=linux-pkg-${{ matrix.arch }},mode=max
      - name: Stage and package
        env:
          CDJ3K_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          docker run --rm -e CDJ3K_VERSION -v "$PWD:/work" cdj3k-emu-linux-pkg \
              "packaging/linux/stage.sh --qemu /work/qemu-linux && packaging/linux/build.sh --version \"\$CDJ3K_VERSION\""
          sudo chown -R "$(id -u):$(id -g)" dist
      # Install the deb and the rpm, each on a clean system of its family,
      # which also checks the declared dependencies, and unpack the AppImage.
      - name: Smoke test
        run: |
          check=/ci/linux-installed-check.sh
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/.github/scripts:/ci:ro" debian:bookworm \
              bash -ec "apt-get update -qq && apt-get install -y -qq /dist/*.deb >/dev/null && $check deb"
          docker run --rm -v "$PWD/dist:/dist:ro" -v "$PWD/.github/scripts:/ci:ro" fedora:latest \
              bash -ec "dnf install -y -q /dist/*.rpm >/dev/null && $check rpm"
          appimage=$(ls dist/*.AppImage)
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          "$RUNNER_TEMP/squashfs-root/opt/cdj3k-emu/bin/qemu-img" --version
          [[ "$(cat "$RUNNER_TEMP/squashfs-root/opt/cdj3k-emu/share/cdj3k-emu/package-kind")" == appimage ]]
      - uses: actions/upload-artifact@v7
        with:
          name: package-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          compression-level: 0

  package-windows:
    name: Package (Windows ${{ matrix.arch }})
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, qemu: x86_64, runner: windows-2025 }
          - { arch: arm64, qemu: aarch64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: guest-payload
      - uses: actions/download-artifact@v8
        with:
          name: windows-cross-${{ matrix.arch }}
      - shell: bash
        run: |
          tar -xf guest-payload.tar && tar -xf windows-cross.tar
          rm guest-payload.tar windows-cross.tar
      - name: Inno Setup
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          $sum = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($sum -ne '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732') { throw "innosetup.exe sha256 $sum" }
          $p = Start-Process -FilePath $installer -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-'
          if ($p.ExitCode -ne 0) { throw "Inno Setup installer exited with $($p.ExitCode)" }
      - name: Stage and build the installer
        shell: powershell
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          & packaging\windows\build.ps1 -Arch ${{ matrix.arch }} `
              -QemuDir qemu\install-windows-${{ matrix.qemu }} `
              -Binary dist\windows-bin-${{ matrix.arch }} -Version $env:VERSION
      # The test runs natively on each architecture and checks that every DLL
      # the staged executables load is in the tree.
      - name: Smoke test
        shell: pwsh
        run: |
          $bin = 'dist\windows-${{ matrix.arch }}\bin'
          foreach ($t in 'qemu-img.exe', 'qemu-system-aarch64.exe') {
              & (Join-Path $bin $t) --version
              if ($LASTEXITCODE -ne 0) { throw "$t exited with $LASTEXITCODE" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: package-windows-${{ matrix.arch }}
          path: dist/CDJ3K-Emulator-*.exe
          compression-level: 0

  release:
    name: Release
    needs: [plan, package-macos, package-linux, package-windows]
    if: needs.plan.outputs.release == 'true'
    # UPDATE_SIGNING_KEY lives in the release environment.
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            packaging/update-ed25519.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      # The release is a draft, so nothing is public until someone publishes
      # it by hand. The tag's message holds the release notes, which go into
      # the release text and both update feeds; GitHub's generated notes stand
      # in for an empty one. The update key (sign.sh) signs
      # the index and the .dmg that the appcast points to; its public half is
      # packaging/update-ed25519.pub, which the app and Info.plist carry. The
      # CD run number is the bundle's CFBundleVersion. A rerun replaces the
      # draft's text and files.
      - name: Draft release
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          .github/scripts/tag-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          .github/scripts/release-draft.sh "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" dist "$RUNNER_TEMP/notes.md"
          echo "Draft: $(gh release view "$GITHUB_REF_NAME" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
