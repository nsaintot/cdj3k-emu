# Lint, build and test on every host. cd.yml packages and releases.
#
#   pull request into main           everything; the E2E scenarios wait for a
#                                    reviewer's approval
#   push to main                     only the builds (build.yml), whose caches
#                                    pull requests reuse; the pull request
#                                    already tested the merged code
#   workflow_dispatch                like a pull request
name: CI

# Lint, Quality, Test (Linux), Test (macOS), Test (Windows) and E2E are the
# checks the "Main" ruleset requires before a merge.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # The code branches on the OS, never on the architecture, so there is one
  # test job per OS, and one Linux job runs the lint, Windows clippy and MSRV
  # checks.
  lint:
    name: Lint
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: rustfmt,clippy
          targets: x86_64-pc-windows-gnullvm
      - run: rustup toolchain install 1.95 --profile minimal
      - run: ./winit/fetch.sh
      - name: rustfmt
        run: cargo fmt --all --check
      # The Windows code is type-checked from Linux: clippy compiles no C for
      # that target, so no mingw toolchain is needed.
      - name: clippy (Linux)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: clippy (Windows)
        run: cargo clippy --workspace --all-targets --locked --target x86_64-pc-windows-gnullvm -- -D warnings
      - name: MSRV (1.95)
        run: cargo +1.95 check --workspace --all-targets --locked
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  # Structural quality: `sentrux check` enforces .sentrux/rules.toml, and
  # `sentrux gate` holds coupling, cycles and god files to
  # .sentrux/baseline.json.
  quality:
    name: Quality
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    env:
      SENTRUX: v0.5.7
    steps:
      - uses: actions/checkout@v7
      # The binary links GTK for its GUI, even when it runs as a CLI. Its
      # grammars come from the same release. The release has no grammar for V,
      # and a missing grammar makes sentrux download the set again on every
      # run.
      - name: sentrux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64
          base="https://github.com/sentrux/sentrux/releases/download/$SENTRUX"
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin" ~/.sentrux/plugins/vlang/grammars
          curl -sSfL -o "$bin/sentrux" "$base/sentrux-linux-x86_64"
          curl -sSfL -o "$RUNNER_TEMP/grammars.tar.gz" "$base/grammars-linux-x86_64.tar.gz"
          sha256sum -c <<EOF
          3237f80fe20d54aad4deefa8a143f0d60543bb5d2d6ad891eb42432f155725a6  $bin/sentrux
          8849f1eb07df3f6d4ea1ed422d8dee4b9b79a250682fa5646675dae466554454  $RUNNER_TEMP/grammars.tar.gz
          EOF
          chmod +x "$bin/sentrux"
          tar xzf "$RUNNER_TEMP/grammars.tar.gz" -C ~/.sentrux/plugins
          : > ~/.sentrux/plugins/vlang/grammars/linux-x86_64.so
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/sentrux" analytics off
      - name: sentrux check
        run: sentrux check .
      - name: sentrux gate
        run: sentrux gate .

  test-linux:
    name: Test (Linux)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libwayland-dev libxkbcommon-dev libx11-dev libgl1-mesa-dev libegl1-mesa-dev
      - uses: ./.github/actions/rust
      - run: ./winit/fetch.sh
      - run: cargo test --workspace --locked
      # The LCD streams poll memory that QEMU writes, and a stale read shows
      # only in an optimised build.
      - run: cargo test --release --locked -p cdj3k-emu-streams

  test-macos:
    name: Test (macOS)
    if: github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust
        with:
          components: clippy
      # cdj3k-emu-runtime links libcdj3k-emu-qemu.dylib on macOS.
      - uses: ./.github/actions/qemu-macos
        with:
          arch: arm64
      # The test binaries carry no rpath to it; dyld's fallback path finds it.
      - run: |
          lib="$PWD/qemu/install-macos-arm64/lib"
          echo "CDJ3K_EMU_QEMU_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$lib" >> "$GITHUB_ENV"
      - run: ./winit/fetch.sh
      - name: clippy (macOS)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  test-windows:
    name: Test (Windows)
    if: github.event_name != 'push'
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      LLVM_MINGW: llvm-mingw-20260922-ucrt-x86_64
    steps:
      - uses: actions/checkout@v7
      # The release links with llvm-mingw (x86_64-pc-windows-gnullvm); the
      # tests do the same, with the version docker/Dockerfile.windows-qemu pins.
      - name: llvm-mingw
        run: |
          curl -sSfL -o "$RUNNER_TEMP/llvm-mingw.zip" \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/${LLVM_MINGW}.zip"
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${LLVM_MINGW}/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/rust
        with:
          targets: x86_64-pc-windows-gnullvm
      - run: ./winit/fetch.sh
      - name: cargo test
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-gnullvm
          CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER: x86_64-w64-mingw32-clang
          CC_x86_64_pc_windows_gnullvm: x86_64-w64-mingw32-clang
          AR_x86_64_pc_windows_gnullvm: llvm-ar
        run: cargo test --workspace --locked

  build:
    name: Build
    uses: ./.github/workflows/build.yml

  # Whether the pull request changes a file that the E2E run builds or runs:
  # the emulator, the guest, QEMU, the Linux packaging, the scenarios and
  # this workflow. A pull request that changes only other files, such as the
  # docs or the macOS and Windows packaging, skips E2E.
  changes:
    name: Changes
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    outputs:
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # HEAD is the merge of the pull request into main, and HEAD^1 is main.
      - id: diff
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              echo e2e=true >> "$GITHUB_OUTPUT"
              exit 0
          fi
          git diff --name-only HEAD^1 HEAD | grep -v '\.md$' | grep -qE \
              -e '^(app|crates|winit|guest|initramfs-patch|dropbear|qemu|packaging/linux|tests/e2e|\.github/actions)/' \
              -e '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|build\.sh|\.dockerignore)$' \
              -e '^docker/Dockerfile(\.linux-(host|pkg).*)?$' \
              -e '^scripts/(make-patch-dispatcher|bundle-sos)\.sh$' \
              -e '^\.github/workflows/(ci|build)\.yml$' \
              && e2e=true || e2e=false
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"

  # The E2E scenarios (docs/e2e.md) on the staged Linux tree. GitHub's runners
  # do not accelerate an aarch64 guest, so the guest runs under TCG and the
  # scenarios marked `#@ needs hw-accel` are skipped. Both runner types run it,
  # to compare their TCG speed.
  #
  # The e2e environment holds CDJ3K_LUKS_CDJ3K, the CDJ-3000 update key file
  # in base64, and its required reviewers hold the job until one approves it.
  # A pull request from a fork gets no secrets, so the job does not run on it.
  e2e:
    name: E2E (Linux ${{ matrix.arch }})
    needs: [build, changes]
    if: >-
      needs.changes.outputs.e2e == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      # The slot the scenarios run on, and its firmware. The references in
      # tests/e2e/scenarios/refs are named after the model and release.
      SLOT: "1"
      MODEL: cdj3k
      RELEASE: "3.20"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: linux-tree-${{ matrix.arch }}
      # The libraries the packages depend on (packaging/linux/nfpm.yaml.in),
      # the X11 libraries and the software GL that the window loads under
      # Xvfb, and the tools the USB fixture needs.
      - name: Install
        run: |
          tar -xf linux-tree.tar -C "$RUNNER_TEMP" && rm linux-tree.tar
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libwayland-client0 libxkbcommon0 \
              libx11-6 libpipewire-0.3-0 libxkbcommon-x11-0 libxcursor1 libxrandr2 \
              libxi6 libx11-xcb1 libgl1-mesa-dri xvfb mtools dosfstools fdisk >/dev/null
          echo "APP=$RUNNER_TEMP/opt/cdj3k-emu/bin/cdj3k-emu" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/cdj3k-emu/firmware
          key: firmware-${{ env.MODEL }}-${{ env.RELEASE }}-${{ hashFiles('tests/e2e/firmware.sha256') }}
      - name: Firmware
        env:
          CDJ3K_LUKS_CDJ3K: ${{ secrets.CDJ3K_LUKS_CDJ3K }}
        run: |
          key="$RUNNER_TEMP/cdj3k.key"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$CDJ3K_LUKS_CDJ3K" | base64 --decode > "$key"
          upd=$(tests/e2e/fetch-firmware.sh "$MODEL" "$RELEASE")
          "$APP" --instance "$SLOT" --model "$MODEL" --provision "$upd" --key "$key"
      - name: Fixtures
        run: tests/e2e/fixtures/make-usb.sh
      - name: Scenarios
        working-directory: tests/e2e/scenarios
        run: xvfb-run -a "$APP" ctl e2e --slot "$SLOT" --launch --report "$RUNNER_TEMP/e2e-report" .
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report-${{ matrix.arch }}
          path: ${{ runner.temp }}/e2e-report
          if-no-files-found: ignore

  # The check that the "Main" ruleset requires. It passes when both E2E jobs
  # pass, or when the pull request needs no E2E run. The ruleset cannot
  # require the matrix jobs: a skipped matrix job reports its name with
  # ${{ matrix.arch }} unexpanded.
  e2e-result:
    name: E2E
    needs: [changes, e2e]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDED: ${{ needs.changes.outputs.e2e }}
          RESULT: ${{ needs.e2e.result }}
          FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          case "$NEEDED/$RESULT" in
              true/success | false/skipped) ;;
              true/skipped) if [ "$FORK" = true ]; then
                      echo "::error::E2E does not run on a fork; push the branch to this repository"
                  else
                      echo "::error::E2E was skipped: a job it needs failed"
                  fi
                  exit 1 ;;
              *) echo "::error::E2E: needed=$NEEDED, result=$RESULT"; exit 1 ;;
          esac
