[package]
name = "cdj3k-emu-ui"
description = "The egui front end. It draws the CDJ-3000, CDJ-3000X and CDJ-1500X panels, simulates the jog wheel, and hosts the setup, mods and update windows."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cdj3k-emu-panel = { path = "../cdj3k-emu-panel" }
cdj3k-emu-control = { path = "../cdj3k-emu-control" }
cdj3k-emu-streams = { path = "../cdj3k-emu-streams" }
cdj3k-emu-platform = { path = "../cdj3k-emu-platform" }
cdj3k-emu-firmware = { path = "../cdj3k-emu-firmware" }
cdj3k-emu-storage = { path = "../cdj3k-emu-storage" }
cdj3k-emu-runtime = { path = "../cdj3k-emu-runtime" }
cdj3k-emu-update = { path = "../cdj3k-emu-update" }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.36"
# Drag reordering for the Mods table.
egui_dnd = "0.17"
# Hashes tessellated meshes for the tilt cache. egui already depends on it.
bytemuck = "1"
glow = "0.17"
# Encodes screenshots for CDJ3K_SCREENSHOT. It is the version muda already uses.
png = "0.17"
puffin = "0.19"
puffin_http = "0.16"
serde_json = "1"
