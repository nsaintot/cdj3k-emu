[package]
name = "cdj3k-emu-platform"
description = "Host integration for macOS, Linux and Windows: windows and menus, audio output enumeration, trackpad haptics and runtime paths."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cdj3k-emu-panel = { path = "../cdj3k-emu-panel", default-features = false }
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36"
libc = "0.2"
raw-window-handle = "0.6"
rfd = { version = "0.15", default-features = false }

# rfd's default backend is GTK3. xdg-portal talks to the desktop portal over
# D-Bus instead, so no GUI toolkit is linked in.
#
# The picker uses async-std because it is called from the UI thread with no
# runtime around it, where zbus's tokio executor panics ("there is no reactor
# running"). async-std's `block_on` drives the executor itself, as a blocking
# dialog needs.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# GNOME draws no server-side decorations on Wayland. Without this feature winit
# draws a plain fallback frame that ignores the light/dark setting. eframe
# enables it only through `winit/default`, which `default-features = false`
# turns off.
winit = { version = "0.30", default-features = false, features = ["wayland", "wayland-csd-adwaita"] }
# x11rb sets WM_NORMAL_HINTS for the X11 aspect lock (desktop/linux.rs). winit
# already depends on it, and its pure-Rust connection needs no system library.
x11rb = { version = "0.13", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The native menu bar, used on macOS only.
muda = "0.15"
# The activation policy that keeps a headless process out of the Dock.
winit = { version = "0.30", default-features = false }
objc2 = { version = "0.5.2", features = ["relax-sign-encoding"] }
objc2-app-kit = { version = "0.2.2", features = ["NSView", "NSWindow", "NSResponder", "NSOpenPanel", "NSPanel", "NSSavePanel", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.2.2", features = ["NSGeometry", "NSString", "NSThread", "NSURL", "libc"] }

# On Windows, these cover the WHPX probe, the build number, the window
# subclass, audio endpoints, network adapters, AF_UNIX sockets and the eMMC lock.
[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
