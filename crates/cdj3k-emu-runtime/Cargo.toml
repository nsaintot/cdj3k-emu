[package]
name = "cdj3k-emu-runtime"
description = "QEMU instance lifecycle: spawn, QMP control, vmnet/tap bridging, USB pass-through."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cdj3k-emu-firmware = { path = "../cdj3k-emu-firmware" }
cdj3k-emu-panel = { path = "../cdj3k-emu-panel", default-features = false }
serde_json = "1"
libc = "0.2"
cdj3k-emu-platform = { path = "../cdj3k-emu-platform" }

[build-dependencies]
# There are none, because build.rs uses only std.

[target.'cfg(target_os = "macos")'.dependencies]
# libcdj3k-emu-qemu.dylib exists only on macOS, because it uses HVF and Cocoa.
# On other platforms this crate compiles but cdj3k_emu_qemu_run is unavailable.

[target.'cfg(target_os = "linux")'.dependencies]
# zbus calls udisks' Block.OpenDevice, which opens a raw USB disk as a file
# descriptor once polkit allows it. It uses the async-io back end because the
# app runs no tokio runtime.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# On Windows, these features provide elevation, job objects, storage ioctls,
# VHDX, the Restart Manager, and TAP adapter installation through SetupAPI and
# the registry.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Vhd",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }
