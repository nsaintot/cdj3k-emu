[package]
name = "cdj3k-emu-panel"
description = "The players the emulator boots: their scalars, their front-panel control map, and the SPI sub-CPU codec that reads it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `egui` is used only for the `Color32` helper in `mosi_frame::led_color`. It sits
# behind a default-on feature, so a consumer that does not render the LED frame
# can drop it with `default-features = false`.
egui = { version = "0.36", optional = true }

[features]
default = ["egui-color"]
egui-color = ["dep:egui"]
